services:
  sonarqube:
    image: sonarqube:community
    container_name: app-reservas-sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - app-reservas-net

  mongo:
    image: mongo
    restart: always
    container_name: app-reservas-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-reservas-net

  auth-service:
    build:
      context: ./auth-service
    container_name: app-reservas-auth
    ports:
      - "4000:4000"
    volumes:
      - ./auth-service:/app
      - /app/node_modules
    environment:
      - MONGO_URI=mongodb://mongo:27017/authdb
      - JWT_SECRET=secreto-super-seguro
    depends_on:
      - mongo
    networks:
      - app-reservas-net

  booking-service:
    build:
      context: ./booking-service
    container_name: app-reservas-booking
    ports:
      - "5000:5000"
    volumes:
      - ./booking-service:/app
      - /app/node_modules
    environment:
      - MONGO_URI=mongodb://mongo:27017/bookingdb
      - JWT_SECRET=secreto-super-seguro
    depends_on:
      - mongo
    networks:
      - app-reservas-net

  notification-service:
    build:
      context: ./notification-service
    container_name: app-reservas-notification
    ports:
      - "5002:5002"
    volumes:
      - ./notification-service:/app
      - /app/node_modules
    environment:
      - EMAIL_HOST=sandbox.smtp.mailtrap.io
      - EMAIL_PORT=2525
      - EMAIL_USER=58b4d823829f7f
      - EMAIL_PASS=e77d610fd759b5
    depends_on:
      - mongo
    networks:
      - app-reservas-net

  user-service:
    build: ./user-service
    container_name: app-reservas-user
    restart: always
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - MONGO_URI=mongodb://mongo:27017/user-service-db
      - JWT_SECRET=secreto-super-seguro
    depends_on:
      - mongo
    networks:
      - app-reservas-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: app-reservas-frontend
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - booking-service
    networks:
      - app-reservas-net

  runner:
    image: ghcr.io/actions/actions-runner:latest
    container_name: app-reservas-runner
    restart: always
    environment:
      - RUNNER_NAME=app-reservas-runner
      - RUNNER_REPO=${GITHUB_REPO_URL}
      - GITHUB_TOKEN=${GITHUB_ACCESS_TOKEN}
      - RUNNER_LABELS=app-reservas,self-hosted
      - RUNNER_WORKDIR=/home/runner/_work
    group_add:
      - "968"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./tools/runner-entrypoint.sh:/home/runner/entrypoint-custom.sh:ro
      - runner_data:/home/runner/_state
    entrypoint: ["/home/runner/entrypoint-custom.sh"]
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -E 'Runner.Listener|run.sh' | grep -v grep"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      - sonarqube
    networks:
      - app-reservas-net

volumes:
  mongo_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  runner_data:

networks:
  app-reservas-net:
    driver: bridge
